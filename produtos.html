```html
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | AutoTech Solutions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Conteúdo -->
    <main class="conteudo">

        <div class="container-fluid">

            <!-- Título -->
            <div class="mb-5">

                <h1 class="fw-bold">
                    Produtos e Soluções
                </h1>

                <p class="text-muted">

                    Conheça nossas soluções em automação industrial
                    voltadas para a Indústria 4.0.

                </p>

            </div>

            <!-- Filtros -->
            <div class="row mb-4">

                <div class="col-md-4">

                    <input type="text"
                           id="pesquisa"
                           class="form-control"
                           placeholder="Pesquisar produto...">

                </div>

                <div class="col-md-3">

                    <select id="categoria"
                            class="form-select">

                        <option value="">

                            Todas as categorias

                        </option>

                        <option value="clp">

                            CLPs

                        </option>

                        <option value="iot">

                            IoT Industrial

                        </option>

                        <option value="paineis">

                            Painéis

                        </option>

                        <option value="servicos">

                            Serviços

                        </option>

                    </select>

                </div>

            </div>

            <!-- Produtos -->
            <div class="row g-4"
                 id="listaProdutos">

                <!-- produtos.js irá preencher -->

            </div>

        </div>

    </main>

    <script src="js/header.js"></script>
    <script src="js/carrinho.js"></script>
    <script src="js/produtos.js"></script>
    <script src="js/include.js"></script>

    <script>

        document
            .getElementById("pesquisa")
            .addEventListener(
                "input",
                renderizarProdutos
            );

        document
            .getElementById("categoria")
            .addEventListener(
                "change",
                renderizarProdutos
            );

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
```
